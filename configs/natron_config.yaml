experiment:
  name: natron_v2
  seed: 42
  output_dir: outputs
  checkpoint_dir: model
  log_dir: logs

data:
  csv_path: data/data_export.csv
  cache_dir: artifacts/cache
  sequence_length: 96
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  feature_normalization: robust
  resample_rule: null
  timezone: UTC

model:
  input_dim: 128  # actual dimension inferred from features, fallback for validation
  d_model: 256
  n_heads: 8
  num_layers: 6
  mlp_ratio: 4
  dropout: 0.1
  activation: gelu
  max_seq_len: 128
  projection_dim: 128

features:
  enable_market_profile: true
  enable_smc: true
  rolling_windows: [5, 10, 14, 20, 50, 96]
  atr_windows: [14, 20]
  bollinger_windows:
    window: 20
    num_std: 2.0
  regime_trend_window: 96
  volume_spike_threshold: 1.5

pretraining:
  run: true
  batch_size: 128
  epochs: 30
  lr: 0.0005
  weight_decay: 0.00001
  masking_ratio: 0.25
  contrastive:
    projection_dim: 128
    temperature: 0.07
    positives: adjacent

supervised:
  run: true
  batch_size: 64
  epochs: 50
  lr: 0.0001
  weight_decay: 0.00001
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 5
  loss_weights:
    buy: 1.0
    sell: 1.0
    direction: 0.8
    regime: 1.2
  freeze_encoder: false

reinforcement:
  run: false
  algo: ppo
  epochs: 10
  steps_per_epoch: 2048
  gamma: 0.995
  gae_lambda: 0.95
  clip_ratio: 0.2
  lr: 0.0003
  entropy_coef: 0.01
  value_coef: 0.5
  turnover_penalty: 0.001
  drawdown_penalty: 0.2

inference:
  host: 0.0.0.0
  port: 8765
  flask_port: 8080
  model_path: model/natron_v2.pt
  device: cuda
  max_batch_size: 32

monitoring:
  poll_interval_s: 5
  alert_thresholds:
    latency_ms: 50
    error_rate: 0.05
  slack_webhook: null

hardware:
  precision: fp16
  gradient_accumulation_steps: 1
  num_workers: 8

mlflow:
  enabled: false
  tracking_uri: null
