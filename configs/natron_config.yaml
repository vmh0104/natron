experiment:
  name: natron_v2
  output_dir: ./outputs
  seed: 42

data:
  csv_path: ./data/data_export.csv
  sequence_length: 96
  feature_cache: ./outputs/feature_cache.parquet
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 8
  batch_size: 64
  normalize: true
  augmentations:
    masking_probability: 0.15
    time_warp: false
    time_dropout: false

model:
  d_model: 256
  nhead: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  positional_encoding: learned

training:
  device: cuda
  precision: fp16
  epochs_pretrain: 50
  epochs_supervised: 80
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  accumulate_steps: 1
  optimizer:
    lr: 0.0001
    weight_decay: 0.00001
    betas: [0.9, 0.999]
  scheduler:
    type: ReduceLROnPlateau
    factor: 0.5
    patience: 5

loss_weights:
  buy: 1.0
  sell: 1.0
  direction: 1.5
  regime: 2.0
  entropy_regularization: 0.01

reinforcement:
  enabled: true
  algorithm: ppo
  steps: 50000
  eval_interval: 5000
  reward:
    profit_weight: 1.0
    turnover_penalty: 0.1
    drawdown_penalty: 0.2

deployment:
  model_path: ./model/natron_v2.pt
  api_host: 0.0.0.0
  api_port: 8081
  socket_port: 8765
  log_level: INFO
