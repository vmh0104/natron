project:
  name: natron_v2
  seed: 1337
  device: cuda
  precision: bf16
  log_dir: logs/
  checkpoint_dir: models/

data:
  csv_path: data/data_export.csv
  cache_dir: data/cache/
  sequence_length: 96
  feature_count: 100
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  normalize: true
  scaler: robust
  augmentations:
    masking_prob: 0.15
    time_warp: 0.1
    jitter: 0.01
    scaling: 0.05

features:
  rolling_windows: [5, 10, 14, 20, 30, 50, 96]
  volatility_windows: [10, 20, 50]
  regression_windows: [5, 10, 20]
  market_profile_bins: 12
  hurst_window: 96

model:
  d_model: 256
  n_heads: 8
  num_encoder_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  activation: gelu
  max_seq_len: 128
  masking_ratio: 0.2
  projection_dim: 128

training:
  batch_size: 64
  num_workers: 8
  max_epochs_pretrain: 50
  max_epochs_supervised: 100
  early_stopping_patience: 12
  grad_clip_norm: 1.0
  optimizer:
    lr: 0.0001
    weight_decay: 0.00001
    betas: [0.9, 0.999]
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 5
  loss_weights:
    buy: 0.8
    sell: 0.8
    direction: 1.0
    regime: 1.2
  contrastive:
    temperature: 0.5
    queue_size: 2048
    momentum: 0.99

reinforcement:
  enabled: true
  algo: ppo
  gamma: 0.99
  lam: 0.95
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 0.0003
  rollout_length: 2048
  mini_batch_size: 256
  epochs: 10
  reward:
    profit_weight: 1.0
    turnover_weight: 0.1
    drawdown_weight: 0.2

inference:
  server_host: 0.0.0.0
  server_port: 7600
  flask_host: 0.0.0.0
  flask_port: 8080
  model_path: models/natron_v2.pt
  encoder_path: models/natron_encoder.pt
  scaler_path: models/scaler.pkl
  regime_labels: [BULL_STRONG, BULL_WEAK, RANGE, BEAR_WEAK, BEAR_STRONG, VOLATILE]

monitoring:
  latency_threshold_ms: 50
  restart_on_failure: true
  metrics_flush_interval: 60
  alert_webhook: ""

deployment:
  docker_image: natron/natron-transformer:latest
  gpu: true
  compose_file: docker-compose.yml
