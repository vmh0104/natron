project:
  name: natron_v2
  seed: 42

paths:
  data_csv: data/data_export.csv
  feature_cache: data/cache/features.parquet
  label_cache: data/cache/labels.parquet
  sequence_cache: data/cache/sequences.pt
  model_dir: model
  log_dir: logs

data:
  sequence_length: 96
  train_val_split: 0.8
  scaler: robust
  cache: true
  num_workers: 4
  pin_memory: true
  unsupervised_augmentations:
    jitter_std: 0.02
    dropout_prob: 0.1
    time_warp_sigma: 0.2

pretraining:
  enabled: true
  objective: masked_contrastive
  epochs: 25
  batch_size: 64
  mask_ratio: 0.15
  contrastive_temperature: 0.07
  projection_dim: 128
  optimizer:
    lr: 0.0003
    weight_decay: 0.00001
  grad_clip: 1.0

supervised:
  enabled: true
  epochs: 30
  batch_size: 48
  optimizer:
    lr: 0.0001
    weight_decay: 0.00001
  scheduler:
    mode: max
    patience: 5
    factor: 0.5
  freeze_encoder_epochs: 3
  early_stopping_patience: 10

loss_weights:
  masked: 0.6
  contrastive: 0.4
  buy: 1.0
  sell: 1.0
  direction: 0.8
  regime: 1.2

rl:
  enabled: false
  algorithm: ppo
  episodes: 60
  horizon: 256
  gamma: 0.99
  lam: 0.95
  clip_ratio: 0.2
  target_kl: 0.02
  value_coef: 0.5
  entropy_coef: 0.01
  lr: 0.0003
  max_grad_norm: 0.5

model:
  input_dim: 100
  d_model: 256
  n_heads: 8
  num_layers: 6
  dim_feedforward: 512
  dropout: 0.1
  pooling: cls
  max_positions: 256

inference:
  threshold_buy: 0.6
  threshold_sell: 0.6
  smoothing_window: 5

server:
  host: 0.0.0.0
  port: 8000
  reload: false
  max_batch_size: 4
  timeout: 3.0
  use_gpu: true
