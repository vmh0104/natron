# Natron Transformer Configuration

# Model Architecture
model:
  input_dim: 100              # Number of input features
  d_model: 256                # Transformer dimension
  nhead: 8                    # Number of attention heads
  num_layers: 6               # Number of transformer layers
  dim_feedforward: 1024       # Feedforward dimension
  dropout: 0.1                # Dropout rate
  sequence_length: 96         # Sequence length (candles)

# Data Configuration
data:
  sequence_length: 96         # Number of consecutive candles per sequence
  train_ratio: 0.7            # Training set ratio
  val_ratio: 0.15             # Validation set ratio
  # test_ratio = 1 - train_ratio - val_ratio

# Training Configuration
training:
  # Phase 1: Pretraining
  phase1:
    enabled: true
    batch_size: 32
    lr: 0.0001
    masked_modeling:
      enabled: true
      epochs: 50
      mask_prob: 0.15
    contrastive:
      enabled: true
      epochs: 30
      temperature: 0.07
  
  # Phase 2: Supervised Fine-Tuning
  phase2:
    enabled: true
    batch_size: 32
    epochs: 100
    lr: 0.0001
    weight_decay: 0.00001
    freeze_encoder: false     # Freeze encoder weights during fine-tuning
    save_path: "models/natron_v2.pt"
  
  # Phase 3: Reinforcement Learning
  phase3:
    enabled: false            # Set to true to enable RL training
    lr: 0.0003
    gamma: 0.99               # Discount factor
    eps_clip: 0.2             # PPO clipping parameter
    k_epochs: 4               # PPO update epochs
    episodes: 1000

# API Server Configuration
api:
  host: "0.0.0.0"
  port: 5000
  model_path: "models/natron_v2.pt"

# MQL5 Socket Server Configuration
socket:
  host: "localhost"
  port: 8888
  model_path: "models/natron_v2.pt"

# Loss Weights (for multi-task learning)
loss_weights:
  buy: 1.0
  sell: 1.0
  direction: 1.0
  regime: 1.0
