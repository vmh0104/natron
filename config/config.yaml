# Natron V2 Configuration

# Data Configuration
data:
  csv_path: "data/data_export.csv"
  sequence_length: 96
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  
# Feature Configuration
features:
  num_features: 100
  normalize: true
  
# Model Configuration
model:
  d_model: 256
  nhead: 8
  num_encoder_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  max_seq_length: 96
  
# Training Configuration
training:
  batch_size: 32
  epochs_pretrain: 50
  epochs_supervised: 100
  epochs_rl: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  gradient_clip: 1.0
  
# Loss Weights
loss_weights:
  buy: 1.0
  sell: 1.0
  direction: 1.0
  regime: 1.5
  
# Pretraining
pretrain:
  mask_ratio: 0.15
  contrastive_temperature: 0.07
  
# Reinforcement Learning
rl:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  reward_profit_weight: 1.0
  reward_turnover_penalty: 0.1
  reward_drawdown_penalty: 0.2
  
# Inference
inference:
  model_path: "model/natron_v2.pt"
  api_port: 5000
  socket_port: 9090
  
# Deployment
deployment:
  device: "cuda"  # cuda or cpu
  log_level: "INFO"
